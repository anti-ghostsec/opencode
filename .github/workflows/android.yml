name: android

on:
  push:
    branches:
      - dev
    paths:
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "packages/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    # Only the fork that carries the Android shell builds it.
    if: github.repository != 'anomalyco/opencode' && github.repository != 'sst/opencode'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # The upstream lockfile does not list the Android package, and leaving it untouched keeps upstream merges
      # free of lockfile conflicts, so this install resolves the Android package's dependencies fresh.
      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Build web app
        working-directory: packages/android
        run: bun run build

      - name: Sync Android project
        working-directory: packages/android
        run: bunx cap sync android

      - name: Write signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: packages/android/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Empty secrets would override the sideload key's defaults.
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || unset "$name"
          done
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/opencode-android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-android
          path: ${{ runner.temp }}/opencode-android.apk

      # A fixed release gives the phone one link that always downloads the newest build.
      - name: Publish latest APK
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7} (run ${{ github.run_number }})."
          git tag -f android-latest "$GITHUB_SHA"
          git push -f origin refs/tags/android-latest
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$RUNNER_TEMP/opencode-android.apk" --clobber
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest "$RUNNER_TEMP/opencode-android.apk" --title "Android (latest)" --notes "$notes" --prerelease
          fi
